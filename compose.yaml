# Portfolio diomoh.com, servi par le Caddy de Tuyo (même VPS).
# Le conteneur rejoint le réseau « web » de Tuyo ; aucun port n'est ouvert sur l'hôte.
services:
  diomoh:
    build: .
    container_name: diomoh
    restart: unless-stopped
    env_file: .env  # SMTP Brevo (voir .env.example)
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    # Plafonds : une surcharge du portfolio ne doit pas affecter les autres services du VPS.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [web]

networks:
  web:
    external: true
    name: ${TUYO_WEB_NETWORK:-app_web}
